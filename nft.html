<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nft</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/my-page/assets/css/style.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/my-page/assets/images/favicon.png">
</head>

<body>
    <nav></nav>

    <header class="art-banner container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <h1 class="display-4">NFT</h1>
                <!-- <p class="lead"></p> -->
            </div>
        </div>
    </header>

    <main class="container py-4">
        <div class="nft row row-cols-1 g-3" id="nftContainer">
            <!-- NFT 將透過 JavaScript 動態載入 -->
            <div class="col text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">載入中...</span>
                </div>
                <p class="mt-2 text-muted">載入 NFT 作品中...</p>
            </div>
        </div>
    </main>

    <footer></footer>

    <section class="blank"></section>

    <script src="/my-page/assets/js/include.js"></script>
    <script>
        includeHTML('nav', '/my-page/components/navbar.html');
        includeHTML('footer', '/my-page/components/footer.html');
    </script>

    <!-- NFT 載入腳本 -->
    <script>
        // 您的 Tezos 錢包地址
        const WALLET_ADDRESS = 'tz2LNGCxCgLsho7zZtwe8iziAFD4Us98YspU';

        // Objkt GraphQL API endpoint
        const OBJKT_API = 'https://data.objkt.com/v3/graphql';

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // 獲取圖片 URL
        function getImageUrl(token) {
            // 優先使用 Objkt 的官方 CDN (已經緩存了圖片)
            // display_uri 通常指向原始內容，但 Objkt CDN 更可靠
            const objktUrl = `https://assets.objkt.media/file/assets-003/${token.fa_contract}/${token.token_id}/thumb288`;

            return objktUrl;
        }

        // 創建 NFT 卡片
        function createNFTCard(token) {
            const col = document.createElement('div');
            col.className = 'col';

            const title = token.name || 'Untitled';
            const description = token.description || '';
            const date = formatDate(token.timestamp);
            const editions = token.supply ? `${token.supply} editions` : '';
            const imgUrl = getImageUrl(token);

            console.log('NFT:', title, 'display_uri:', token.display_uri, 'thumbnail_uri:', token.thumbnail_uri, '最終圖片URL:', imgUrl);

            // 判斷平台
            let platformUrl = `https://objkt.com/tokens/${token.fa_contract}/${token.token_id}`;
            let platformName = 'Objkt';

            // 檢查是否為 Akaswap (KT1AFq5XorPduoYyWxs5gEyrFK6fVjJVbtCj)
            if (token.fa_contract === 'KT1AFq5XorPduoYyWxs5gEyrFK6fVjJVbtCj') {
                platformUrl = `https://akaswap.com/akaobj/${token.token_id}`;
                platformName = 'Akaswap';
            }
            // 檢查是否為 EditArt (KT1LjmAdYQCLBjwv4S2oFkEzyHVkomAf5MrW)
            else if (token.fa_contract === 'KT1LjmAdYQCLBjwv4S2oFkEzyHVkomAf5MrW') {
                platformUrl = `https://editart.xyz/objkt/${token.token_id}`;
                platformName = 'EditArt';
            }

            col.innerHTML = `
                <div class="card mb-0">
                    <a href="${platformUrl}" class="text-decoration-none" target="_blank">
                        <div class="row g-2 align-items-center p-2">
                            <img 
                                src="${imgUrl}" 
                                class="nft-img col-sm-12 col-md-5 col-lg-3" 
                                alt="${title}"
                                loading="lazy"
                                onerror="handleImageError(this, '${token.fa_contract}', '${token.token_id}')">
                            <div class="card-body col-sm-12 col-md-7 col-lg-9">
                                <h5 class="card-title">${title}</h5>
                                <small class="card-text text-muted">
                                    <b>${platformName} | ${date}${editions ? ' | ' + editions : ''}</b>
                                    <hr>
                                    <span>${description}</span>
                                </small>
                            </div>
                        </div>
                    </a>
                </div>
            `;

            return col;
        }

        // 處理圖片加載失敗
        function handleImageError(img, contract, tokenId) {
            console.log('圖片加載失敗:', img.src, '嘗試備用方案');
            // 嘗試 Objkt CDN
            const backupUrl = `https://assets.objkt.media/file/assets-003/${contract}/${tokenId}/thumb288`;
            if (img.src !== backupUrl) {
                img.src = backupUrl;
                img.onerror = () => {
                    console.log('備用方案也失敗，使用佔位圖');
                    img.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22288%22 height=%22288%22%3E%3Crect width=%22288%22 height=%22288%22 fill=%22%23f0f0f0%22/%3E%3C/svg%3E';
                };
            } else {
                img.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22288%22 height=%22288%22%3E%3Crect width=%22288%22 height=%22288%22 fill=%22%23f0f0f0%22/%3E%3C/svg%3E';
            }
        }

        // 從 Objkt API 載入 NFT
        async function fetchNFTsFromAPI() {
            const query = `
                query GetCreatorTokens($address: String!) {
                    token(
                        where: {
                            creators: {
                                creator_address: {_eq: $address}
                            }
                        }
                        order_by: {timestamp: desc}
                    ) {
                        token_id
                        fa_contract
                        name
                        description
                        display_uri
                        thumbnail_uri
                        timestamp
                        supply
                    }
                }
            `;

            try {
                console.log('開始載入 NFT，錢包地址:', WALLET_ADDRESS);

                const response = await fetch(OBJKT_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        variables: {
                            address: WALLET_ADDRESS
                        }
                    })
                });

                console.log('API 回應狀態:', response.status);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('API 回應數據:', data);

                if (data.errors) {
                    console.error('GraphQL errors:', data.errors);
                    throw new Error('API 請求失敗: ' + JSON.stringify(data.errors));
                }

                return data.data.token || [];
            } catch (error) {
                console.error('載入 NFT 詳細錯誤:', error);
                throw error;
            }
        }

        // 顯示錯誤訊息
        function showError(message, details = '') {
            const container = document.getElementById('nftContainer');
            container.innerHTML = `
                <div class="col text-center py-5">
                    <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
                    <p class="mt-3 text-muted">${message}</p>
                    ${details ? `<p class="text-muted small">${details}</p>` : ''}
                    <button class="btn btn-primary mt-2" onclick="location.reload()">重新載入</button>
                </div>
            `;
        }

        // 顯示空狀態
        function showEmpty() {
            const container = document.getElementById('nftContainer');
            container.innerHTML = `
                <div class="col text-center py-5">
                    <i class="bi bi-inbox text-muted" style="font-size: 3rem;"></i>
                    <p class="mt-3 text-muted">目前沒有找到 NFT 作品</p>
                </div>
            `;
        }

        // 載入並顯示 NFT
        async function loadNFTs() {
            const container = document.getElementById('nftContainer');

            try {
                const tokens = await fetchNFTsFromAPI();
                console.log('成功取得 tokens:', tokens.length, '個');

                if (tokens.length === 0) {
                    showEmpty();
                    return;
                }

                container.innerHTML = ''; // 清空載入提示

                tokens.forEach(token => {
                    const card = createNFTCard(token);
                    container.appendChild(card);
                });

                console.log(`成功載入 ${tokens.length} 個 NFT`);
            } catch (error) {
                console.error('loadNFTs 錯誤:', error);
                showError('載入 NFT 時發生錯誤，請稍後再試', '請開啟瀏覽器控制台查看詳細錯誤訊息');
            }
        }

        // 頁面載入完成後執行
        document.addEventListener('DOMContentLoaded', () => {
            loadNFTs();
        });
    </script>

    <!-- Bootstrap JS Bundle (含 Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/my-page/assets/js/main.js"></script>
</body>

</html>
